name: MSBuild

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution
        run: msbuild .\vs2017\ACR.sln -m -v:minimal /p:Configuration=GitHub /p:Platform=x64
